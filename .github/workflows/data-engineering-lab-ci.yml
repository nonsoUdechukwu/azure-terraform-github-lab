name: Data engineering lab
on:
  push:
    paths: ['data-engineering-lab/**', '.github/workflows/data-engineering-lab-ci.yml']
  pull_request:
    paths: ['data-engineering-lab/**', '.github/workflows/data-engineering-lab-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s data-engineering-lab/tests -v
      - run: python data-engineering-lab/src/pipeline.py --db /tmp/retail-ci.db
