name: Course examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - run: bash scripts/validate.sh
